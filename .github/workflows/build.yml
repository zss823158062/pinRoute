name: Build Pinroute

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^1.6" --locked

    - name: Install frontend dependencies
      run: pnpm install

    - name: Build Tauri app
      run: pnpm tauri build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pinroute-windows-x64
        path: src-tauri/target/release/pinroute.exe

    - name: Package release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: Compress-Archive -Path src-tauri/target/release/pinroute.exe -DestinationPath "pinroute-${{ github.ref_name }}-windows-x64.zip"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: pinroute-${{ github.ref_name }}-windows-x64.zip
        generate_release_notes: true
